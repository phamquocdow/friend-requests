    <button class="anh1">Xem thêm</button>
    <script>
        const confirmButtons = document.querySelectorAll('.nutxn');
        confirmButtons.forEach(button => {
            button.addEventListener('click', () => {
                const request = button.closest('.box2');
                request.remove();
            });
        });
        const deleteButtons = document.querySelectorAll('.nutxoa');
        deleteButtons.forEach(button => {
            button.addEventListener('click', () => {
                const request = button.closest('.box2');
                request.remove();
            });
        });
        const xemThemButton = document.querySelector('.anh1');
        if (xemThemButton) {
            xemThemButton.addEventListener('click', () => {
                xemThemButton.innerText = 'Hết';
            });
        }
