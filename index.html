<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite App</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <style>
      body{
        width: 100vw;
        height: 100vh;
        justify-content: center;
        align-items: center;
      }
      div.box{
        width: 300px;
        height: 300px;
        background: white;
        border-radius: 10px;
        gap: 10px;
      }
      p.input-label{
        font-weight: 500;
        font-size: 14px;
      }
      input.input-field{
        background: aqua;
        padding: 5px 10px;
        border: 2px solid rgba(94, 86, 86, 0.1);
        border-radius: 5px;
        box-shadow: 0 4px 4px rgba(0, 0, 0, 0.25);
        font-size: 14px;
      }
      div.input-box{
        display: flex;
        flex-direction: column;
        gap: 5px;
        width: 100%;
      }
      div.content{
        display: flex;
        flex-direction: column;
      }
      button.signin-btn{

      }
      div.action{
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        width: 100%;

      }
    </style>

  </head>
  <body class="bg-gray-100">
  <div class="box">
    <div class="content">
    <div class="input-boxbox">
    <p class="input-label">Username</p>
      <input class="input-field" name="username" placeholder="Username"/>
    </div>
    <div class="input-box">
      <p class="input-label">Password</p>
      <input class="input-field" name="Password" placeholder="Password"/>
    </div>
      <div class="action">
        <button class="signin-btn">Sign In</button>
        <p>Forgot</p>
      </div>
    </div>
  </div>
  </body>
</html>
